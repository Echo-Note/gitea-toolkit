name: CI

# 触发时机：
#   - 推送到 main
#   - 面向 main 的 PR
#   - 手动触发
#
# 纯文档改动不触发（见 paths-ignore）：改 README / CHANGELOG 不需要跑类型检查与打包。
# 注意 package.json **不在**忽略列表里 —— 版本号递增正是发版的触发条件，不能漏。
#
# ⚠️ 若将来给 main 加分支保护、并把本 workflow 设为必需状态检查，
#    paths-ignore 会让「只改文档的 PR」不产生任何检查结果，从而永远等不到状态、无法合并。
#    届时改用「一个永远运行的 gate job + 各 job 按 paths 条件执行」的写法。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免连续推送时排队堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限，需要写 issue 的 job 再单独提权
permissions:
  contents: read

env:
  # 扩展宿主内置的 Node 版本较旧，esbuild 的 target 是 node20；
  # CI 用当前 LTS（22）验证，产物本身向下兼容 node20。
  NODE_VERSION: '22'

jobs:
  verify:
    name: 校验（类型 / Lint / 清单）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npm run compile

      - name: ESLint
        run: npm run lint

      - name: 校验 AI 工具清单与代码定义一致
        # 防止改了 src/ai/tools 却忘了同步 package.json 的 contributes.languageModelTools
        run: npm run check:tools

      - name: 校验 codicon 图标名真实存在
        # VS Code 对拼错的图标名是静默忽略的，必须在 CI 拦住
        run: npm run check:icons

  package:
    name: 构建打包
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 VSIX
        # 关键：CI 里必须跳过版本号递增。
        # 否则每次构建都会改写 package.json 与 CHANGELOG.md，且版本号会随流水线无意义地涨。
        run: SKIP_VERSION_BUMP=1 npm run package

      - name: 生成校验和
        # 发布物就两样：.vsix 本身 + 独立校验和。
        # 不再额外打压缩包 —— .vsix 已经是 deflate 压缩的 zip，套一层只会变大，
        # 而且 `code --install-extension` 不认 zip，用户还得多解压一步。
        run: |
          set -euo pipefail
          sha256sum *.vsix > SHA256SUMS
          cat SHA256SUMS

      - name: 展示产物信息
        run: |
          ls -lh ./*.vsix SHA256SUMS
          node -e "const p=require('./package.json');console.log('版本:',p.version)"

      - name: 上传 VSIX 与校验和
        uses: actions/upload-artifact@v7
        with:
          name: gitea-toolkit-vsix
          path: |
            *.vsix
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建产物（可选，便于排查打包差异）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dist-on-failure
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: 打 tag 并发布
    needs: package
    # 只在 main 上发布，PR 不发布。
    #
    # 「是否发版」由「版本号是否变过」决定：若 package.json 的版本已有对应 tag/Release 就跳过。
    # 因此日常推送不会产生 Release，只有主动升级版本号（npm run version:patch 等）才会发版。
    # tag 由 gh release create 依据 package.json 的版本自动创建，无需人工 git tag。
    #
    # 注意：这里创建 tag 会触发 push(tag) 事件，但本 workflow 只监听 push(branches: main)，
    # 因此不会自我触发，无需 [skip ci]。
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tagExists: ${{ steps.resolve.outputs.tag_exists }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载已构建的 VSIX
        # 复用 package job 的产物，避免重复构建
        uses: actions/download-artifact@v7
        with:
          name: gitea-toolkit-vsix

      - name: 解析版本号并判断是否已发布
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过发布::v${VERSION} 的 Release 已存在。产物仍作为 artifact 上传；若要发版请先升级版本号。"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} 尚未发布，准备创建 tag 与 Release"
          fi

      - name: 校验产物完整性
        # 用 package job 生成的校验和，确认跨 job 传递后产物未损坏
        # （同时保证发布出去的 hash 与附件确实对得上）
        run: |
          set -euo pipefail
          test -f SHA256SUMS || { echo "::error::缺少 SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS

      - name: 发布到 Open VSX
        id: ovsx
        # 刻意放在创建 Release **之前**，顺序不能反：
        # 本 job 用「v<版本> 的 Release 是否存在」判断该版本是否已发（见 step resolve）。
        # 若先建 Release 再发市场，一旦市场发布失败，重跑时 tag_exists 就成了 true，
        # 市场发布步骤会被整个跳过 —— 该版本将永远上不了架，只能人工补发。
        # 反过来则可以自愈：市场发布成功 → 建 Release 失败 → 重跑时市场步骤幂等跳过，只补 Release。
        #
        # CodeBuddy 的扩展源是 Open VSX（见 README「发布到扩展市场」），所以这才是主通道。
        if: steps.resolve.outputs.tag_exists == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          NS="$(node -p "require('./package.json').publisher")"
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ steps.resolve.outputs.version }}"
          API="https://open-vsx.org/api/${NS}/${NAME}"

          # 未配置 secret 时静默降级，不阻断发版：
          # 这样本步骤可以先合入，等 token 就绪后无需再改 workflow 即自动生效。
          # 用 ${OVSX_PAT:-} 而非 ${OVSX_PAT}：脚本开了 set -u，
          # 变量在「未定义」而非「空值」时直接取用会报 unbound variable 而中断。
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice title=跳过 Open VSX 发布::未配置 OVSX_PAT secret。产物仍会发到 GitHub Releases；配置该 secret 后本步骤自动启用。"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 幂等：同版本已发布过就跳过（典型场景是 job 失败后重跑）
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "${API}/${VERSION}")" = "200" ]; then
            echo "::notice title=跳过 Open VSX 发布::${NS}.${NAME}@${VERSION} 已存在。"
            echo "result=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! npx --yes ovsx publish "gitea-toolkit-${VERSION}.vsix" -p "${OVSX_PAT}"; then
            # 复查后再判定：Open VSX 的版本接口在「扩展/命名空间不存在」时返回 503 而非 404，
            # 且偶发抖动，不能只看命令退出码就认定失败。
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "${API}/${VERSION}")" = "200" ]; then
              echo "::warning title=Open VSX 已有该版本::发布命令报错，但 ${VERSION} 确实已在 Open VSX 上，按成功处理。"
              echo "result=exists" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Open VSX 发布失败::请确认 OVSX_PAT 有效，且命名空间 ${NS} 已创建并已签署 Publisher Agreement。"
            exit 1
          fi

          echo "::notice title=已发布到 Open VSX::${NS}.${NAME}@${VERSION}"
          echo "result=published" >> "$GITHUB_OUTPUT"

      - name: 创建 Release（同时依据打包版本打 tag）
        id: publish
        if: steps.resolve.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          test -f "gitea-toolkit-${VERSION}.vsix" || {
            echo "::error::未找到产物 gitea-toolkit-${VERSION}.vsix"
            ls -l ./*.vsix || true
            exit 1
          }
          # --target 让 tag 精确指向本次实际构建的提交，避免落到别的提交上
          gh release create "v${VERSION}" "gitea-toolkit-${VERSION}.vsix" SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
          echo "::notice title=已发布::tag v${VERSION} → ${GITHUB_SHA}"

      - name: 写入摘要
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          TAG_EXISTS="${{ steps.resolve.outputs.tag_exists }}"
          OVSX_RESULT="${{ steps.ovsx.outputs.result }}"
          {
            echo "## 发版结果"
            echo
            if [ "${TAG_EXISTS}" = "false" ]; then
              echo "✅ 已创建 tag \`v${VERSION}\` 并发布 Release"
              echo
              echo "附件：\`gitea-toolkit-${VERSION}.vsix\`、\`SHA256SUMS\`"
              echo
              echo "Release：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
              echo
              echo "校验下载：\`shasum -a 256 -c SHA256SUMS\`"
              echo
              case "${OVSX_RESULT}" in
                published)
                  echo "**Open VSX**：已发布 ✅"
                  echo
                  echo "> 若这是**首次**上架，记得把 \`src/vscode/updateChecker.ts\` 的 \`UPDATE_CHANNEL\`"
                  echo "> 改成 \`'marketplace'\`。否则编辑器已从 Open VSX 自动更新，扩展还会另外提示"
                  echo "> 「去 GitHub 下载 .vsix」，两条更新通道会互相打架（详见 README「发布到扩展市场」）。"
                  ;;
                exists)
                  echo "**Open VSX**：该版本已存在，跳过 ⏭️"
                  ;;
                *)
                  echo "**Open VSX**：未发布 —— 未配置 \`OVSX_PAT\` secret ⏭️"
                  echo
                  echo "> 配置仓库 secret \`OVSX_PAT\` 后，本步骤会在下次发版时自动启用，无需再改 workflow。"
                  ;;
              esac
            else
              echo "⏭️ 跳过：\`v${VERSION}\` 已存在（版本号未变更）"
              echo
              echo "本次产物已作为 artifact \`gitea-toolkit-vsix\` 上传，可在运行页面下载。"
              echo "需要发版请先 \`npm run version:patch\`（或 minor/major）提交后再推送。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: 构建失败 → 创建 Issue
    needs: [verify, package, release]
    # 只在 main 分支失败时建 issue：
    #   - PR 失败不建，否则每个 bugfix 分支都会刷 issue
    #   - main 失败说明主干已损坏，必须有人知道
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # 注意：显式声明 permissions 后，未列出的 scope 会被置为 none。
      # 读取 workflow run 的 job 列表需要 actions: read，漏掉会直接 403。
      actions: read
    steps:
      - name: 创建或更新失败 Issue
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'ci-failure';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // 1) 确保 label 存在（给不存在的 label 建 issue 会直接报错）
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: 'd73a4a',
                  description: '主干 CI 构建失败（修复后自动关闭）',
                });
              } else {
                throw error;
              }
            }

            // 2) 收集失败的 job。
            //    拿不到详情不应该让「报告失败」这件事本身也失败，因此降级为提示看日志。
            let failedList = '- 未能获取失败 job 详情，请查看运行日志';
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              const failed = jobs.filter((job) => job.conclusion === 'failure');
              if (failed.length > 0) {
                failedList = failed.map((job) => `- [\`${job.name}\`](${job.html_url})`).join('\n');
              }
            } catch (error) {
              core.warning(`获取失败 job 详情出错：${error.message}`);
            }

            const sha = (context.sha || '').slice(0, 7);
            const body = [
              '## 主干构建失败',
              '',
              '| 项目 | 值 |',
              '| --- | --- |',
              `| 分支 | \`${context.ref.replace('refs/heads/', '')}\` |`,
              `| 提交 | [\`${sha}\`](${context.serverUrl}/${owner}/${repo}/commit/${context.sha}) |`,
              `| 触发 | ${context.eventName} · @${context.actor} |`,
              `| 运行 | [#${context.runNumber}](${runUrl}) |`,
              '',
              '### 失败的步骤',
              '',
              failedList,
              '',
              '### 本地复现',
              '',
              '```bash',
              'npm ci',
              'npm run ci        # 类型检查 + ESLint + 工具清单 + 图标名校验',
              'npm run package   # 打包（本地会递增版本号，CI 中已跳过）',
              '```',
              '',
              '### 处理说明',
              '',
              `修复后重新推送到 \`main\`，CI 通过时该 issue 会被**自动关闭**。`,
              '',
              `<!-- ci-failure-report -->`,
            ].join('\n');

            // 3) 幂等：已有未关闭的失败 issue 就追加评论，而不是再建一个
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: LABEL,
              per_page: 5,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `### 再次失败\n\n${body}`,
              });
              core.info(`已在 #${issue.number} 追加失败记录`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: '[CI] main 分支构建失败',
                body,
                labels: [LABEL],
              });
              core.info(`已创建 issue #${created.data.number}`);
            }

  close-failure-issue:
    name: 构建恢复 → 关闭 Issue
    needs: [verify, package, release]
    # 形成闭环：修好之后不用人工去关那个失败 issue
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 关闭遗留的失败 Issue
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'ci-failure';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: LABEL,
              per_page: 20,
            });

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `✅ CI 已恢复，自动关闭该 issue。\n\n通过运行：[#${context.runNumber}](${runUrl})`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`已关闭 #${issue.number}`);
            }

            if (open.length === 0) {
              core.info('没有遗留的失败 issue');
            }
