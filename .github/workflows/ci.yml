name: CI

# 触发时机：
#   - 推送到 main
#   - 面向 main 的 PR
#   - 手动触发
#
# 纯文档改动不触发（见 paths-ignore）：改 README / CHANGELOG 不需要跑类型检查与打包。
# 注意 package.json **不在**忽略列表里 —— 版本号递增正是发版的触发条件，不能漏。
#
# ⚠️ 若将来给 main 加分支保护、并把本 workflow 设为必需状态检查，
#    paths-ignore 会让「只改文档的 PR」不产生任何检查结果，从而永远等不到状态、无法合并。
#    届时改用「一个永远运行的 gate job + 各 job 按 paths 条件执行」的写法。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免连续推送时排队堆积
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限，需要写 issue 的 job 再单独提权
permissions:
  contents: read

env:
  # 扩展宿主内置的 Node 版本较旧，esbuild 的 target 是 node20；
  # CI 用当前 LTS（22）验证，产物本身向下兼容 node20。
  NODE_VERSION: '22'
  # Python **构建**用的版本：取最低支持版本（= python/pyproject.toml 里 requires-python 的
  # 下界），这样「用最低版本也能构建出产物」本身也是被验证过的。产物是 py3-none-any
  # （纯 Python），构建解释器不改变兼容范围。
  # 注意：**测试**用的版本不在这里，而在 python-test job 的 matrix 里（下界 + 最新稳定
  # 两档）—— 测试要多版本，构建只需要一个，刻意分开。
  PYTHON_BUILD_VERSION: '3.10'

jobs:
  verify:
    name: 校验（类型 / Lint / 清单）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npm run compile

      - name: ESLint
        run: npm run lint

      - name: 校验 AI 工具清单与代码定义一致
        # 防止改了 src/ai/tools 却忘了同步 package.json 的 contributes.languageModelTools
        run: npm run check:tools

      - name: 校验 codicon 图标名真实存在
        # VS Code 对拼错的图标名是静默忽略的，必须在 CI 拦住
        run: npm run check:icons

      - name: 校验 CHANGELOG（无未填占位、版本号与 package.json 一致）
        # CHANGELOG 会进 .vsix 并显示在扩展市场的 Changelog 标签页上，占位文本会被用户
        # 看到（0.8.1 发生过：bump-version 插入的「待补充」没人写就发了出去）。
        # 本步骤放在 verify 里，而 release 依赖 package 依赖 verify，因此能挡住发布。
        run: npm run check:changelog

  python-test:
    name: Python 测试（${{ matrix.python-version }}）
    # 独立成 job，而不是把测试塞进 verify：**matrix 是 job 级的**，塞进 verify 会让
    # tsc / ESLint / 各项清单校验也跟着按版本数重复跑一遍（它们与 Python 版本无关）。
    # 拆开后它与 verify 并行，既不增加墙钟时间，也不浪费 runner。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 一个版本失败不取消其他版本：一次运行就能看清「到底哪个版本不行」，
      # 而不是被 fail-fast 打断、只剩第一条错误。
      fail-fast: false
      matrix:
        # 只取两端：
        #   - **最低支持版本**（= pyproject 里 requires-python 的下界）：能挡住误用更高
        #     版本才有的语法/标准库（例如 3.12 才有的 itertools.batched）。
        #   - **当前最新稳定版**：能挡住被移除的标准库（3.13 起移除了一批）。
        # 中间版本几乎不提供额外信息 —— 任何特性都有明确的引入版本，会被下界拦下。
        # 刻意不含预览版（如 3.15.0aN）：发布物不该因一个尚未稳定的解释器而变红。
        python-version: ['3.10', '3.14']
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行 Python 侧测试
        # `python/` 是**会被自动发布到 PyPI 的产物**，所以它的测试必须在发布之前跑过 ——
        # 否则 CI 就是「自动发布一个从没验证过的包」。本 job 与 verify 同为发布链路的
        # 上游（package 依赖它俩），因此同样能挡住发布（与 check:changelog 同理）。
        #
        # 用 `pip install ./python` 而不是设 PYTHONPATH：顺带验证了**打包配置本身**
        # （hatchling 的 src 布局声明是否正确），且测试跑的是**安装后的包** ——
        # 与用户 `uvx gitea-toolkit-mcp` 装到的是同一个东西。
        #
        # 测试里读 TS 源码做常量比对用的是 `Path(__file__).parents[2]`（不依赖 CWD），
        # 因此从仓库根目录跑没有路径问题。
        run: |
          set -euo pipefail
          python -m pip install ./python
          python -m unittest discover -s python/tests -v

      - name: 冒烟测试：已安装的命令行入口与版本上报
        # 为什么单独加这一步：单元测试 import 的是包内模块，走不到 **console script**
        # 与版本上报这条路径 —— 而 0.9.3 发布前踩的 bug 恰好就在这里：包装的是新版本，
        # `--version` 却报着硬编码的旧版本号（装到 0.9.3、它显示 0.9.1），直到用户
        # 实测才发现。下面把「pyproject / 包内 __version__ / 命令行上报」三者对齐关系
        # 机械化，避免同类问题再靠人眼发现。
        run: |
          set -euo pipefail
          EXPECTED="$(python -c "import pathlib,re;print(re.search(r'^version = \"(.*)\"$', pathlib.Path('python/pyproject.toml').read_text(), re.M).group(1))")"
          IN_PKG="$(python -c "import gitea_toolkit_mcp as m; print(m.__version__)")"
          CLI="$(gitea-toolkit-mcp --version | awk '{print $NF}')"
          echo "  pyproject=${EXPECTED} ｜ 包内 __version__=${IN_PKG} ｜ 命令行上报=${CLI}"
          if [ "${EXPECTED}" != "${IN_PKG}" ] || [ "${EXPECTED}" != "${CLI}" ]; then
            echo "::error title=版本号三处不一致::pyproject=${EXPECTED}、包内 __version__=${IN_PKG}、命令行=${CLI}（检查 scripts/bump-version.mjs 的 python 版本同步）"
            exit 1
          fi

  package:
    name: 构建打包
    # 依赖两个上游：JS 侧校验（verify）与 Python 侧多版本测试（python-test）。
    # 两者都是发布物的前置条件，都通过才打包、也才可能发布。
    needs: [verify, python-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 VSIX
        # 关键：CI 里必须跳过版本号递增。
        # 否则每次构建都会改写 package.json 与 CHANGELOG.md，且版本号会随流水线无意义地涨。
        run: SKIP_VERSION_BUMP=1 npm run package

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_BUILD_VERSION }}

      - name: 构建 Python 发行包（wheel + sdist）
        # 在 package job 里构建、由 publish-pypi 复用，理由与 VSIX 相同：PyPI 官方
        # action 也建议「构建与发布分离」，且这样三个发布物（扩展 / npm 包 / PyPI 包）
        # 出自同一次运行、同一个版本号（版本一致性由 verify 里的 check:changelog 强制）。
        # 用 PyPA 的 build 而不是引入 uv：少一个第三方 action，且它是「按
        # pyproject.toml 构建」的标准做法（本包用 hatchling 作后端）。
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          cd python
          python -m build
          ls -lh dist/

      - name: 生成校验和
        # 发布物就两样：.vsix 本身 + 独立校验和。
        # 不再额外打压缩包 —— .vsix 已经是 deflate 压缩的 zip，套一层只会变大，
        # 而且 `code --install-extension` 不认 zip，用户还得多解压一步。
        run: |
          set -euo pipefail
          sha256sum *.vsix > SHA256SUMS
          cat SHA256SUMS

      - name: 展示产物信息
        run: |
          ls -lh ./*.vsix SHA256SUMS
          node -e "const p=require('./package.json');console.log('版本:',p.version)"

      - name: 上传 VSIX 与校验和
        uses: actions/upload-artifact@v7
        with:
          name: gitea-toolkit-vsix
          # 独立 MCP 包的产物一并上传：它由同一次 esbuild 产出（见 esbuild.js 的
          # emitMcpPackage），release job 里的 npm 发布直接复用，不重新构建。
          # 包目录里的 package.json / README.md 来自 checkout，无需上传。
          path: |
            *.vsix
            SHA256SUMS
            packages/mcp-server/dist/index.js
            packages/mcp-server/LICENSE
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Python 发行包
        # 独立成一个 artifact，而不是混进 gitea-toolkit-vsix：那个名字专指扩展产物，
        # 混装会让下游 job 里 `sha256sum -c SHA256SUMS` 的语义变含糊。
        uses: actions/upload-artifact@v7
        with:
          name: gitea-toolkit-pypi-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建产物（可选，便于排查打包差异）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dist-on-failure
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  resolve:
    name: 解析版本与发布状态
    needs: package
    # 为什么单独抽一个 job：各发布通道要**并行**发布，而并行的前提是各自成一个 job；
    # 而它们都需要同一份「版本号 + 该版本是否已经发过」的判断，所以放在这里共享。
    #
    # 「是否发版」由「版本号是否变过」决定：若 package.json 的版本已有对应 Release 就跳过。
    # 因此日常推送不会发版，只有主动升级版本号（npm run version:patch 等）才会发版。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tagExists: ${{ steps.resolve.outputs.tag_exists }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 解析版本号并判断是否已发布
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过发布::v${VERSION} 的 Release 已存在。产物仍作为 artifact 上传；若要发版请先升级版本号。"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} 尚未发布，准备创建 tag 与 Release"
          fi

  publish-ovsx:
    name: 发布到 Open VSX
    needs: [package, resolve]
    # 三个市场**各自独立成 job、并行发布**（PyPI 通道同理，见 publish-pypi）。
    # 原先它们是同一个 job 里连续的三步 —— 那样不但串行，而且**任一步失败会让后面的步骤
    # 被整体跳过**：例如 Open VSX 报错会导致 Marketplace 压根不去尝试发布。拆开后互不牵连。
    #
    # ⚠️ 但「市场发布必须先于创建 Release」这条不变：Release 是否存在，正是本流程判断
    #    「该版本是否已发」的依据（见 resolve job）。下面的 release job 用 needs 保证
    #    自己一定在这些发布 job 之后才运行。
    #
    # CodeBuddy 的扩展源是 Open VSX（见 README「发布到扩展市场」），所以这是主通道。
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载已构建的 VSIX
        # 复用 package job 的产物，避免重复构建
        uses: actions/download-artifact@v7
        with:
          name: gitea-toolkit-vsix

      - name: 校验产物完整性
        # 用 package job 生成的校验和，确认跨 job 传递后产物未损坏
        run: |
          set -euo pipefail
          test -f SHA256SUMS || { echo "::error::缺少 SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS

      - name: 发布到 Open VSX
        id: publish
        # 刻意排在创建 Release **之前**，顺序不能反：Release 是否存在就是本流程判断
        # 「该版本是否已发」的依据（见 resolve job）。若先建 Release 再发市场，
        # 一旦市场发布失败，重跑时 tag_exists 就成了 true，市场步骤会被整个跳过 ——
        # 该版本将永远上不了架，只能人工补发。
        # 反过来可以自愈：市场发布成功 → 建 Release 失败 → 重跑时市场步骤幂等跳过，只补 Release。
        if: needs.resolve.outputs.tagExists == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          NS="$(node -p "require('./package.json').publisher")"
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ needs.resolve.outputs.version }}"
          API="https://open-vsx.org/api/${NS}/${NAME}"

          # 未配置 secret 时静默降级，不阻断发版：
          # 这样本步骤可以先合入，等 token 就绪后无需再改 workflow 即自动生效。
          # 用 ${OVSX_PAT:-} 而非 ${OVSX_PAT}：脚本开了 set -u，
          # 变量在「未定义」而非「空值」时直接取用会报 unbound variable 而中断。
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice title=跳过 Open VSX 发布::未配置 OVSX_PAT secret。产物仍会发到 GitHub Releases；配置该 secret 后本步骤自动启用。"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 幂等：同版本已发布过就跳过（典型场景是 job 失败后重跑）
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "${API}/${VERSION}")" = "200" ]; then
            echo "::notice title=跳过 Open VSX 发布::${NS}.${NAME}@${VERSION} 已存在。"
            echo "result=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! npx --yes ovsx publish "gitea-toolkit-${VERSION}.vsix" -p "${OVSX_PAT}"; then
            # 复查后再判定：Open VSX 的版本接口在「扩展/命名空间不存在」时返回 503 而非 404，
            # 且偶发抖动，不能只看命令退出码就认定失败。
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "${API}/${VERSION}")" = "200" ]; then
              echo "::warning title=Open VSX 已有该版本::发布命令报错，但 ${VERSION} 确实已在 Open VSX 上，按成功处理。"
              echo "result=exists" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Open VSX 发布失败::请确认 OVSX_PAT 有效，且命名空间 ${NS} 已创建并已签署 Publisher Agreement。"
            exit 1
          fi

          echo "::notice title=已发布到 Open VSX::${NS}.${NAME}@${VERSION}"
          echo "result=published" >> "$GITHUB_OUTPUT"

  publish-vsce:
    name: 发布到 VS Code Marketplace
    needs: [package, resolve]
    # 与 publish-ovsx 同理：独立成 job 以便并行，且必须排在创建 Release 之前。
    # 注意这里只需要默认的 contents: read —— 若将来 Marketplace 迁移到 Entra ID
    # （vsce publish --azure-credential），要在这里补 id-token: write 才能取到 OIDC 令牌。
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载已构建的 VSIX
        uses: actions/download-artifact@v7
        with:
          name: gitea-toolkit-vsix

      - name: 校验产物完整性
        run: |
          set -euo pipefail
          test -f SHA256SUMS || { echo "::error::缺少 SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS

      - name: 发布到 VS Code Marketplace
        id: publish
        # 与「发布到 Open VSX」同样的顺序约束：必须排在创建 Release 之前
        # （Release 是否存在就是本流程判断该版本是否已发的依据，见 resolve job）。
        #
        # ⚠️ 认证方式的时限：Marketplace 要求 PAT 的 Organization 必须是
        #    「All accessible organizations」，而 Azure DevOps 的**全局 PAT 将于 2026-12-01 完全停用**
        #    —— 正是这一类。届时需迁移到 Entra ID（`vsce publish --azure-credential`，
        #    需 vsce ≥ 2.26.1，且要 Azure 订阅 + 托管标识 + 服务连接）。
        #    迁移后本步骤可改为走 --azure-credential 并删掉 VSCE_PAT secret。
        if: needs.resolve.outputs.tagExists == 'false'
        env:
          # vsce 的 -p/--pat 默认读取 VSCE_PAT 环境变量，故不必把令牌写进命令行参数
          # （避免出现在进程列表里；GitHub 的日志脱敏对参数是有效的，但环境变量更稳妥）
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          PUBLISHER="$(node -p "require('./package.json').publisher")"
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ needs.resolve.outputs.version }}"
          EXT_ID="${PUBLISHER}.${NAME}"

          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice title=跳过 Marketplace 发布::未配置 VSCE_PAT secret。产物仍会发到 GitHub Releases 与 Open VSX；配置该 secret 后本步骤自动启用。"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 幂等判重：查该版本是否已在 Marketplace 上（典型场景是 job 失败后重跑）。
          # 查询失败时保守放行——真正的重复由 --skip-duplicate 兜住，不会误报失败。
          has_version() {
            local body
            body="$(printf '{"filters":[{"criteria":[{"filterType":7,"value":"%s"}],"pageSize":1,"pageNumber":1}],"flags":950}' "${EXT_ID}")"
            curl -s --max-time 20 -X POST \
              -H 'Accept: application/json;api-version=7.2-preview.1' \
              -H 'Content-Type: application/json' \
              --data "${body}" \
              'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
              | VERSION="${VERSION}" python3 -c "import json,os,sys;d=json.load(sys.stdin);e=(d.get('results') or [{}])[0].get('extensions') or [];print('yes' if e and any(v.get('version')==os.environ['VERSION'] for v in (e[0].get('versions') or [])) else 'no')" 2>/dev/null | grep -q '^yes$'
          }

          if has_version; then
            echo "::notice title=跳过 Marketplace 发布::${EXT_ID}@${VERSION} 已存在。"
            echo "result=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 发布正式件。--packagePath 直接发已构建的 vsix：
          #   1. 不在 git 仓库里触发 npm version（否则会自建 commit 与 tag，与 CI 发版流程打架）
          #   2. 保证市场件与 GitHub Release / Open VSX 三处字节一致
          # --skip-duplicate 让「版本已存在」静默成功，重跑安全。
          if ! npx --yes @vscode/vsce publish --packagePath "gitea-toolkit-${VERSION}.vsix" --skip-duplicate; then
            if has_version; then
              echo "::warning title=Marketplace 已有该版本::发布命令报错，但 ${EXT_ID}@${VERSION} 已在市场上，按成功处理。"
              echo "result=exists" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Marketplace 发布失败::请确认 VSCE_PAT 有效（Organization 须选 All accessible organizations，作用域须含 Marketplace → Manage），且 publisher「${PUBLISHER}」已在 https://marketplace.visualstudio.com/manage 创建。"
            exit 1
          fi

          echo "::notice title=已发布到 VS Code Marketplace::${EXT_ID}@${VERSION}"
          echo "::notice title=认证方式时限::Azure DevOps 全局 PAT 将于 2026-12-01 停用，届时本步骤需迁移到 Entra ID（vsce publish --azure-credential）。"
          echo "result=published" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: 发布到 npm
    needs: [package, resolve]
    # 与另外两个市场同理：独立成 job 以便并行，且必须排在创建 Release 之前。
    #
    # 发布到**公共 npm registry**（registry.npmjs.org），secret 为 `NPM_TOKEN`。
    # 0.7.0 起曾改发 GitHub Packages（当时图它不用额外 secret），但 GitHub Packages
    # **匿名装不了**（连公开包也要令牌），用户只能去 Releases 下 tarball，体验很差；
    # 而 ModelScope MCP 广场的托管部署也明确要求包在 npmjs.org / PyPI 上。
    # 因此改回公共 registry。
    #
    # id-token: write 用于 `npm publish --provenance`（来源证明）；它要求仓库公开。
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        # registry-url 只写入 .npmrc 的 registry 行；这里不提供任何 token —— 认证交给 OIDC
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: 下载已构建的 MCP 包产物
        # 独立 MCP 包的 dist/index.js 由 package job 与 vsix 一起上传
        uses: actions/download-artifact@v7
        with:
          name: gitea-toolkit-vsix

      - name: 发布到 npm（registry.npmjs.org）
        id: publish
        # 发布到**公共 npm registry**。认证支持两种方式，二选一即可：
        #   1. secret `NPM_TOKEN`（**必须是带「绕过 2FA」的 granular token**，
        #      否则 npm 会以 403 拒绝：账号开了 2FA 时，令牌必须显式允许绕过 2FA）
        #   2. **OIDC 可信发布**（无需任何令牌）—— 在 npm 包设置里配 Trusted Publisher
        #      指向本仓库的 `ci.yml` 即可；本 job 已声明 id-token: write，满足其要求。
        #      注意它需要包**已存在**，所以首次发布只能用方式 1 或本地手动发。
        #
        # 与另外两个市场同样的顺序约束：必须排在创建 Release 之前（见 resolve job）。
        #
        # ⚠️ **本步骤刻意不受 `tagExists` 门控**（两个扩展市场则受控，这是有意的差别）：
        # 那两个通道失败会让 job 直接失败 → 连累 Release → 所以永远不会出现
        # 「Release 已建、但市场没发出去」的状态；而 npm 的凭据类失败是**降级跳过**（不阻断），
        # 于是 Release 照常建出 → tagExists 变 true → npm 就**再也补不上了**（实测 0.9.1 撞到）。
        # 改为「每次都跑」，靠下面的幂等检查（npm view）兜住重复发布：
        #   已发布 → result=exists 直接退出；未发布 → 正好补上。
        # 这样凭据修好后**不必再升一个版本**，重跑一次运行即可补发。
        # （PR 由 job 级 if 拦住，不受影响。）
        #
        # ⚠️ **刻意不传 `NODE_AUTH_TOKEN`**：只要该环境变量存在，npm 就会**优先用它**、
        # 根本不去尝试 OIDC —— 这正是「配了可信发布却仍然失败」的原因。实测路径：
        # 先 E403（令牌没勾绕过 2FA）、换成新令牌后 EOTP（要求 OTP，而 CI 里没人能输）。
        # OIDC 是官方推荐、无需长期密钥、也不受 2027-01「bypass 令牌失去自动发布能力」影响，
        # 因此这里只保留 OIDC 一条路，对应的 `NPM_TOKEN` secret 已删除。
        run: |
          set -euo pipefail

          # ⚠️ **可信发布（OIDC）要求 npm CLI ≥ 11.5.1**（官方原文：Trusted publishing requires
          # npm CLI version 11.5.1 or later and Node version 22.14.0 or higher）。
          # 而 `node-version: '22'` 自带的是 **npm 10.x** —— npm 10 **根本不尝试 OIDC**，
          # 于是发出一个无身份的请求，npm 按「查无此包」返回 **404**，与"未配可信发布"时的
          # 报错一模一样（对 npm 来说确实没区别）。这就是 0.9.1 反复 404 的真正原因。
          # Node 22 已满足 ≥ 22.14，只差把 npm 升上来。
          echo "发布前环境：node $(node -v) / npm $(npm -v)"
          npm install -g npm@latest >/dev/null 2>&1 || true
          echo "升级 npm 后：node $(node -v) / npm $(npm -v)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC 环境变量：已就绪（id-token: write 生效）"
          else
            echo "::warning::未检测到 ACTIONS_ID_TOKEN_REQUEST_URL —— id-token: write 可能未生效"
          fi

          PKG_DIR="packages/mcp-server"
          NAME="$(node -p "require('./${PKG_DIR}/package.json').name")"
          VERSION="$(node -p "require('./${PKG_DIR}/package.json').version")"

          # 认证：**只走 OIDC 可信发布**（本 job 已声明 id-token: write，npm CLI ≥ 11.5.1 会自动使用）。
          # 前置条件：npm 包设置 → Trusted publishing 里已添加 GitHub Actions，
          # 仓库 `Echo-Note/gitea-toolkit`、工作流文件名 `ci.yml`。没配好就会以「凭据未就绪」跳过。
          echo "::notice::认证方式：OIDC 可信发布（无需任何令牌）。"

          # 两个包共用同一版本号，是「同一次构建产出、内容一致」的前提。
          # 一旦分叉就没人说得清哪个包版本对应哪个扩展版本，故在此硬拦。
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          if [ "${VERSION}" != "${ROOT_VERSION}" ]; then
            echo "::error title=包版本与扩展不一致::${PKG_DIR}=${VERSION}，扩展=${ROOT_VERSION}。请检查 scripts/bump-version.mjs 的版本同步是否生效。"
            exit 1
          fi

          test -f "${PKG_DIR}/dist/index.js" || {
            echo "::error::缺少 ${PKG_DIR}/dist/index.js（构建产物应由 package job 上传）"
            exit 1
          }

          # **进入包目录再执行 npm**：registry 与认证由 setup-node 写入的根 .npmrc
          # 加上包自身 publishConfig 决定，在包目录里跑保证读到的是本包的配置。
          cd "${PKG_DIR}"

          # 幂等：该版本已发布过就跳过（典型场景是 job 失败后重跑）
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice title=跳过 npm 发布::${NAME}@${VERSION} 已存在。"
            echo "result=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --provenance：把「这个包确实由本仓库的这次构建产出」写进 npm 的签名记录。
          # 走 OIDC 时 npm 会自动生成溯源证明，显式传参也无害。
          LOG="$(mktemp)"
          if npm publish --access public --provenance 2>&1 | tee "${LOG}"; then
            echo "::notice title=已发布到 npm::${NAME}@${VERSION} —— 用户可直接 npx -y ${NAME}"
            echo "result=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 失败诊断（只在失败路径执行）：把「认证到底有没有发出身份」的关键信息留下来，
          # 免得下次还要靠猜。刻意只取 http fetch 这类安全行，**不转储整个调试日志**
          # （它可能含凭据）。
          echo "::notice::诊断 —— node $(node -v) / npm $(npm -v) / OIDC 环境变量 $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo 有 || echo 无)"
          DEBUGLOG="$(ls -t "${HOME}"/.npm/_logs/*-debug-0.log 2>/dev/null | head -1 || true)"
          if [ -n "${DEBUGLOG}" ]; then
            grep -ahE "http fetch.*(PUT|GET)" "${DEBUGLOG}" 2>/dev/null | tail -4 || true
          fi

          # 复查后判定：可能是并发/重跑导致的「版本已存在」，而非真的失败
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::warning title=npm 已有该版本::发布命令报错，但 ${NAME}@${VERSION} 确实已存在，按成功处理。"
            echo "result=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # **任何发布失败都必须让流水线失败。**
          # 用户明确要求：任一渠道失败即整体失败。之前「配置类失败降级为跳过」的设计会让这个 job
          # 显示 success 却根本没发布 —— 反而分不清成败（本项目的真实教训，已彻底移除该机制）。
          # 失败即失败还带来一个好处：Release 不会被创建 → 版本仍然"未发过" → 下次推送自动重试。
          DETECTED="$(grep -m1 -iE 'ENEEDAUTH|EOTP|E404|E403|Not found|Two-factor|one-time password' "${LOG}" | cut -c1-200)"
          echo "::error title=npm 发布失败::${DETECTED:-详见上方 npm 输出}"
          # 下面只是给出可操作的原因判断，不影响「失败」这个结论
          if grep -qiE "E404|Not found|is not in this registry" "${LOG}"; then
            if npm view "${NAME}" version >/dev/null 2>&1; then
              echo "::error::包在 npm 上已存在，所以这是「身份不被认可」的 404 —— 检查 npm 包设置 → Trusted publishing（仓库 Echo-Note/gitea-toolkit、工作流文件名 ci.yml、**必须勾选允许 npm publish**），以及 runner 的 npm CLI 是否 ≥ 11.5.1（本步骤已在发布前自动升级）。"
            else
              echo "::error::包在 npm 上还不存在 —— 可信发布要求包已存在，需先手动发布一次（cd packages/mcp-server && npm publish --access public）。"
            fi
          elif grep -qiE "EOTP|Two-factor|one-time password" "${LOG}"; then
            echo "::error::npm 要求一次性密码 —— CI 无法提供。确认没有传 NODE_AUTH_TOKEN（它会压制 OIDC），并已配置 Trusted Publisher。"
          fi
          exit 1

  publish-pypi:
    name: 发布到 PyPI
    needs: [package, resolve]
    # 与三个市场同理：独立成 job 以便并行，且必须排在创建 Release 之前
    # （Release 是否存在就是本流程判断「该版本是否已发」的依据，见 resolve job）。
    #
    # 认证走 **OIDC 可信发布（Trusted Publishing）**：不需要任何长期令牌，因此不存在
    # 「密钥过期」这类问题（对比 VSCE_PAT 的 2026-12-01 时限）。只需在 PyPI 配一次
    # 待发布者（Account settings → Publishing → Add a pending publisher）：
    #
    #   PyPI Project Name = gitea-toolkit-mcp
    #   Owner             = Echo-Note
    #   Repository name   = gitea-toolkit
    #   Workflow name     = ci.yml      ← 必须与 workflow **文件名**完全一致（不含路径）
    #   Environment name  = （留空）     ← 本 job 刻意不声明 environment，两边必须一致
    #
    # 五个字段必须与实际运行值完全一致，否则 OIDC 令牌校验会失败（报错只说"身份不匹配"）。
    # 尚未在 PyPI 创建过本项目也能配 —— pending publisher 正是为首次发布准备的。
    #
    # ⚠️ 未配置时本 job 会**失败**，而不是静默跳过 —— 与 npm 通道同样的取舍：配置类失败
    #    降级为跳过会让 job 显示 success 却根本没发布（本项目真实教训）。失败后 Release
    #    不会创建 → 该版本仍算「未发过」→ 配好 publisher 后重跑本运行即可补齐（各通道幂等）。
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # ⚠️ 可信发布的必需项：缺它 action 无法向 PyPI 表明身份（官方文档明确要求）。
      #    只加在发布 job 上，不要提到 workflow 级 —— 减少不必要的凭据暴露面。
      id-token: write
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载已构建的 Python 发行包
        uses: actions/download-artifact@v7
        with:
          name: gitea-toolkit-pypi-dist
          # 落到独立子目录：publish action 会把该目录里的**所有**文件交给 twine，
          # 若与 vsix 等其他产物同处一个目录，会被一并误传。
          path: pypi-dist

      - name: 校验产物并判断是否已发布
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="$(sed -n 's/^name = "\(.*\)"$/\1/p' python/pyproject.toml | head -1)"
          # 下面的 exists 输出**只在本版本确已在 PyPI 上时**才写 true；未设置即视为未发布，
          # 后续步骤一律按 `!= 'true'` 判断 —— 因此不必先写一个 false（避免依赖
          # 「同一个 key 重复写、以最后一个为准」这种隐式行为）。

          # 1) 产物必须与本次版本号对得上。构建发生在 package job，这里是防呆：
          #    若版本漏同步（例如只升了 package.json），宁可在此失败，也不要把
          #    旧版本的包发上去 —— PyPI 的版本号一旦占用就**不能重发**。
          shopt -s nullglob
          wheels=(pypi-dist/*-"${VERSION}"-*.whl)
          sdists=(pypi-dist/*-"${VERSION}".tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error title=PyPI 产物与版本不符::pypi-dist 中对应 v${VERSION} 的 wheel/sdist 不是各 1 个"
            ls -l pypi-dist/ || true
            exit 1
          fi

          # 2) 幂等：该版本已在 PyPI 上就跳过（典型场景是 job 失败后重跑）。
          #    查公开 JSON 接口即可，不需要任何凭据；项目/版本还不存在时它返回 404，
          #    正好落到「未发布」分支（首次发布就是这种情况）。
          if curl -sf --max-time 20 "https://pypi.org/pypi/${NAME}/json" \
               | VERSION="${VERSION}" python3 -c "import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('releases',{}).get(os.environ['VERSION']) else 1)"; then
            echo "::notice title=跳过 PyPI 发布::${NAME} ${VERSION} 已存在。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 PyPI（可信发布）
        if: steps.check.outputs.exists != 'true'
        # 用 PyPA 官方 action：它负责「取 OIDC 身份 → 换短期令牌 → 上传」，并打印项目链接；
        # 默认还会生成 PEP 740 数字证明（与 npm 通道的 --provenance 对应）。
        #
        # ⚠️ 版本钉到精确 tag，而不用官方文档里常见的 `@release/v1`：分支 ref 会随上游变化
        #    （该仓库的 master 分支版本已 sunset），且本仓库的 check:workflows 要求
        #    uses 形如 owner/repo@ref —— 带斜杠的 `@release/v1` 会被它判为非法。
        #    升级版本时改这一行即可（tag 见 github.com/pypa/gh-action-pypi-publish/releases）。
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: pypi-dist/
          # 幂等兜底：只覆盖「上一步查完索引之后、上传之前」被并发插入的极端情况。
          # 常规重跑在上一步就已经以 exists 退出，不会走到这里。
          skip-existing: true

      - name: 汇总结果
        id: publish
        # 单独一个步骤写 job 输出：上面的发布步骤可能被 if 跳过（此时它不会写输出，
        # 直接引用会拿到空串，摘要里就成了「未成功」）。
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "result=exists" >> "$GITHUB_OUTPUT"
          else
            echo "result=published" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: 打 tag 并创建 Release
    needs: [resolve, publish-ovsx, publish-vsce, publish-npm, publish-pypi]
    # 刻意排在全部发布通道**之后**（由 needs 保证）。原因是本流程用「v<版本> 的 Release 是否
    # 存在」判断该版本是否已发（见 resolve job）：若先建 Release 再发市场，市场一旦失败，
    # 重跑时 tag_exists 就成了 true，各发布通道会被整体跳过，该版本永远上不了架。
    # 反过来可以自愈：市场发成功 → 建 Release 失败 → 重跑时市场步骤幂等跳过，只补 Release。
    #
    # 这里创建 tag 会触发 push(tag) 事件，但本 workflow 只监听 push(branches: main)，
    # 因此不会自我触发，无需 [skip ci]。
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # 供 OIDC 场景留用（例如将来 Marketplace 迁移到 Entra ID）。发布 MCP 包所需的
      # 发布 MCP 包所需的 id-token 已经跟着发布步骤移到 publish-npm，这里不再需要。
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 下载已构建的 VSIX
        # 复用 package job 的产物（含独立 MCP 包的 dist/index.js）
        uses: actions/download-artifact@v7
        with:
          name: gitea-toolkit-vsix

      - name: 校验产物完整性
        # 用 package job 生成的校验和，确认跨 job 传递后产物未损坏
        # （同时保证发布出去的 hash 与附件确实对得上）
        run: |
          set -euo pipefail
          test -f SHA256SUMS || { echo "::error::缺少 SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS

      - name: 打包独立 MCP 包为 tarball（供匿名 npx）
        # 为什么还要这一步：0.7.0–0.8.5 期间包发在 GitHub Packages，那个源**不接受匿名安装**
        # （连公开包也要令牌），所以需要一条「零配置」通路。现已改为发布到公共 npm registry，
        # `npx -y @echo-note/gitea-toolkit-mcp` 可直接用 —— 这一步作为**离线 / 固定版本**的备份保留：
        # GitHub Release 的附件下载是公开的，且 npm/npx 支持直接执行远程 tarball
        # （已实测：`npx <tarball-url>` 可用）。因此把它作为 Release 附件发布，
        # 给「不想配认证」的人一条零配置通路。
        #
        # 附件名**刻意不带版本号**：这样 `releases/latest/download/gitea-toolkit-mcp.tgz`
        # 是稳定地址，而 `releases/download/v<版本>/gitea-toolkit-mcp.tgz` 又能精确锁版本
        # —— 版本信息由 tag 承载，不必写进文件名。
        if: needs.resolve.outputs.tagExists == 'false'
        run: |
          set -euo pipefail
          # npm pack 是本地操作，不需要认证；package.json / README 来自 checkout，
          # dist/index.js 来自 package job 上传的 artifact
          test -f "packages/mcp-server/dist/index.js" || {
            echo "::error::缺少 packages/mcp-server/dist/index.js，无法打包 tarball"
            exit 1
          }
          # 用 npm pack 输出的文件名而不是通配符：包名含 scope 时产物名是
          # `echo-note-gitea-toolkit-mcp-<版本>.tgz`，通配符在无匹配时会让 mv 失败
          TARBALL="$(cd packages/mcp-server && npm pack --silent | tail -1)"
          mv "packages/mcp-server/${TARBALL}" ./gitea-toolkit-mcp.tgz
          ls -lh gitea-toolkit-mcp.tgz
          echo "::notice title=已生成 MCP tarball::匿名安装可用 npx -y <Release 附件地址>"

      - name: 生成 Release 说明（取自 CHANGELOG）
        if: needs.resolve.outputs.tagExists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          # 正文直接取 CHANGELOG 里该版本的区块，而不是 --generate-notes 的自动摘要：
          # 后者按 commit / PR 罗列，与 CHANGELOG 里那份写给人看、有分类有原因的说明
          # 完全是两回事 —— 用户反馈过「Releases 缺失 changelog」。
          # 用同一来源还保证「扩展市场的 Changelog 标签页」「.vsix 里的 CHANGELOG」
          # 「Release 说明」三者说的是同一件事。
          node scripts/release-notes.mjs --out release-notes.md

          # 补一条版本对比链接：它原先由 --generate-notes 附带，改用 --notes-file 后需要自己加。
          # 起点取「当前最新一个已存在的 Release」；首次发版时没有前一个，跳过即可。
          PREV="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          if [ -n "${PREV}" ]; then
            {
              echo
              echo '---'
              echo
              echo "**完整变更对比**：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
            } >> release-notes.md
          else
            echo "::notice title=未找到上一个 Release::本次是首个版本，跳过变更对比链接。"
          fi

          # 追加发布通道状态。为什么写进 Release 说明：某个通道没发出去时，
          # 原先只在运行日志里闪一条 warning，事后无从查证。Release 页面是「这个版本
          # 到底发出去了哪些地方」的天然落点，写在这里就永久可见、且与版本一一对应。
          ch_status() {
            case "${1}" in
              published) echo '已发布 ✅' ;;
              exists)    echo '已存在（幂等跳过）⏭️' ;;
              skipped) echo '未启用（未配置 secret）⏭️' ;;
              *)         echo '未成功 ⚠️' ;;
            esac
          }
          {
            echo
            echo '---'
            echo
            echo '### 发布通道'
            echo
            echo '| 通道 | 本次结果 |'
            echo '| --- | --- |'
            echo "| Open VSX | $(ch_status '${{ needs.publish-ovsx.outputs.result }}') |"
            echo "| VS Code Marketplace | $(ch_status '${{ needs.publish-vsce.outputs.result }}') |"
            echo "| npm · \`npx @echo-note/gitea-toolkit-mcp\` | $(ch_status '${{ needs.publish-npm.outputs.result }}') |"
            echo "| PyPI · \`uvx gitea-toolkit-mcp\` | $(ch_status '${{ needs.publish-pypi.outputs.result }}') |"
          } >> release-notes.md

          echo "::notice title=Release 说明已生成::取自 CHANGELOG 的 ${VERSION} 区块，共 $(wc -l < release-notes.md) 行"

      - name: 创建 Release（同时依据打包版本打 tag）
        id: publish
        if: needs.resolve.outputs.tagExists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          test -f "gitea-toolkit-${VERSION}.vsix" || {
            echo "::error::未找到产物 gitea-toolkit-${VERSION}.vsix"
            ls -l ./*.vsix || true
            exit 1
          }
          test -f release-notes.md || {
            echo "::error::缺少 release-notes.md（应由上一步从 CHANGELOG 生成）"
            exit 1
          }
          # --target 让 tag 精确指向本次实际构建的提交，避免落到别的提交上。
          # --notes-file：正文来自 CHANGELOG，取代原来的 --generate-notes。
          gh release create "v${VERSION}" "gitea-toolkit-${VERSION}.vsix" SHA256SUMS gitea-toolkit-mcp.tgz \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
          echo "::notice title=已发布::tag v${VERSION} → ${GITHUB_SHA}"

      - name: 写入摘要
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.version }}"
          TAG_EXISTS="${{ needs.resolve.outputs.tagExists }}"
          OVSX_RESULT="${{ needs.publish-ovsx.outputs.result }}"
          VSCE_RESULT="${{ needs.publish-vsce.outputs.result }}"
          NPM_RESULT="${{ needs.publish-npm.outputs.result }}"
          PYPI_RESULT="${{ needs.publish-pypi.outputs.result }}"
          {
            echo "## 发版结果"
            echo
            if [ "${TAG_EXISTS}" = "false" ]; then
              echo "✅ 已创建 tag \`v${VERSION}\` 并发布 Release"
              echo
              echo "附件：\`gitea-toolkit-${VERSION}.vsix\`、\`SHA256SUMS\`、\`gitea-toolkit-mcp.tgz\`"
              echo
              echo "Release：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
              echo
              echo "校验下载：\`shasum -a 256 -c SHA256SUMS\`"
              echo
              case "${OVSX_RESULT}" in
                published)
                  echo "**Open VSX**：已发布 ✅"
                  ;;
                exists)
                  echo "**Open VSX**：该版本已存在，跳过 ⏭️"
                  ;;
                *)
                  echo "**Open VSX**：未发布 —— 未配置 \`OVSX_PAT\` secret ⏭️"
                  echo
                  echo "> 配置仓库 secret \`OVSX_PAT\` 后，本步骤会在下次发版时自动启用，无需再改 workflow。"
                  ;;
              esac
              echo
              case "${VSCE_RESULT}" in
                published)
                  echo "**VS Code Marketplace**：已发布 ✅"
                  ;;
                exists)
                  echo "**VS Code Marketplace**：该版本已存在，跳过 ⏭️"
                  ;;
                *)
                  echo "**VS Code Marketplace**：未发布 —— 未配置 \`VSCE_PAT\` secret ⏭️"
                  echo
                  echo "> 配置仓库 secret \`VSCE_PAT\` 后，本步骤会在下次发版时自动启用，无需再改 workflow。"
                  echo "> ⚠️ Azure DevOps 全局 PAT 将于 **2026-12-01** 停用，届时需迁移到 Entra ID。"
                  ;;
              esac
              echo
              case "${NPM_RESULT}" in
                published)
                  echo "**npm**：\`@echo-note/gitea-toolkit-mcp\` 已发布 ✅（可 \`npx -y @echo-note/gitea-toolkit-mcp\`）"
                  ;;
                exists)
                  echo "**npm**：该版本已存在，跳过 ⏭️"
                  ;;
                *)
                  echo "**npm**：未发布 ⏭️ —— 凭据未就绪或未配置（详见该 job 的 warning 注解；配置好后重跑即可补齐，发布步骤是幂等的）"
                  ;;
              esac
              echo
              case "${PYPI_RESULT}" in
                published)
                  echo "**PyPI**：\`gitea-toolkit-mcp\` 已发布 ✅（可 \`uvx gitea-toolkit-mcp\`）"
                  ;;
                exists)
                  echo "**PyPI**：该版本已存在，跳过 ⏭️"
                  ;;
                *)
                  echo "**PyPI**：未发布 ⚠️ —— 可信发布未配置或上传失败，详见该 job 日志"
                  echo
                  echo "> 需在 PyPI 添加待发布者：Project \`gitea-toolkit-mcp\`、Owner \`Echo-Note\`、Repository \`gitea-toolkit\`、Workflow \`ci.yml\`、Environment 留空。"
                  ;;
              esac
            else
              echo "⏭️ 跳过：\`v${VERSION}\` 已存在（版本号未变更）"
              echo
              echo "本次产物已作为 artifact \`gitea-toolkit-vsix\` 上传，可在运行页面下载。"
              echo "需要发版请先 \`npm run version:patch\`（或 minor/major）提交后再推送。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: 构建失败 → 创建 Issue
    # 必须把全部发布 job 都列进来：任一市场发布失败时，release job 会被跳过
    # （它 needs 这几个），若这里只写 release，就不会触发失败报告。
    needs: [verify, python-test, package, resolve, publish-ovsx, publish-vsce, publish-npm, publish-pypi, release]
    # 只在 main 分支失败时建 issue：
    #   - PR 失败不建，否则每个 bugfix 分支都会刷 issue
    #   - main 失败说明主干已损坏，必须有人知道
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # 注意：显式声明 permissions 后，未列出的 scope 会被置为 none。
      # 读取 workflow run 的 job 列表需要 actions: read，漏掉会直接 403。
      actions: read
    steps:
      - name: 创建或更新失败 Issue
        uses: actions/github-script@v9
        env:
          # 供脚本里调用 gh CLI 取失败日志（github-script 自身的 API 客户端走 github-token，
          # 但子进程读的是环境变量，必须显式给）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { execSync } = require('child_process');
            const LABEL = 'ci-failure';
            // 正文里的固定标记：用来**认领**本流程自己建的 issue。
            // 只靠 label 不够稳妥（label 可被别人加或删），标记则一定是我们写的。
            const MARKER = '<!-- ci-failure-report -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const branch = context.ref.replace('refs/heads/', '');
            const sha = (context.sha || '').slice(0, 7);
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;

            // 1) 确保 label 存在（给不存在的 label 建 issue 会直接报错）
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: 'd73a4a',
                  description: '主干 CI 构建失败（修复后自动关闭）',
                });
              } else {
                throw error;
              }
            }

            // 2) 失败的 job 与失败步骤。
            //    拿不到详情不应该让「报告失败」这件事本身也失败，因此降级为提示看日志。
            let failedList = '- 未能获取失败 job 详情，请查看运行日志';
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              const failed = jobs.filter((job) => job.conclusion === 'failure');
              if (failed.length > 0) {
                failedList = failed
                  .map((job) => {
                    const steps = (job.steps || [])
                      .filter((step) => step.conclusion === 'failure')
                      .map((step) => `\`${step.name}\``)
                      .join('、');
                    return `- [\`${job.name}\`](${job.html_url})${steps ? ` —— 失败步骤：${steps}` : ''}`;
                  })
                  .join('\n');
              }
            } catch (error) {
              core.warning(`获取失败 job 详情出错：${error.message}`);
            }

            // 3) 错误详情：关键错误摘要 + 折叠的完整失败日志。
            //    为什么必须带上：用户反馈「构建失败的 issue 没有错误详情」—— 只写「某 job 失败」
            //    等于让人再点进日志里翻。取日志用 gh CLI（runner 预装，不引入第三方 action），
            //    且放在同一个动作里；取不到也不影响「报告失败」本身。
            let logSection;
            try {
              const raw = execSync(
                `gh run view ${context.runId} --repo ${owner}/${repo} --log-failed`,
                { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, stdio: ['ignore', 'pipe', 'ignore'] },
              );
              if (raw && raw.trim()) {
                // 去掉 ANSI 颜色码与 gh 输出前缀里的时间戳（保留 job / 步骤名，那是有用信息）
                const lines = raw
                  .split('\n')
                  .map((line) => line
                    .replace(/\x1b\[[0-9;]*m/g, '')
                    .replace(/^([^\t]*\t[^\t]*\t)?\d{4}-\d{2}-\d{2}T[\d:.]+Z /, ''));
                // ⚠️ 「关键错误」**不能**按 ::error 字面量匹配 —— gh 会把「执行的命令本身」
                //    也打进日志，命中的于是变成我们脚本的源码，真正的错误反而被淹没（实测踩过）。
                //    正确做法：取 runner **渲染后**的 ##[error] 注解（那才是写给人看的一句话结论），
                //    并先剔除 echo 源码行；取不到再退回工具自身的错误输出。
                const isNoise = (line) => line.includes('::error') || /^\s*echo\s+["']/.test(line);
                const candidates = lines.filter((line) => !isNoise(line));
                const annotated = candidates.filter((line) => line.includes('##[error]'));
                // 底层工具自己的报错（如 `npm error 403 ... bypass 2fa`）——最该露出来的就是这种行，
                // 光有我们自己写的结论不够。排除 ##[error] 以免与上面重复。
                const toolErrors = candidates.filter((line) =>
                  !line.includes('##[error]') &&
                  /(npm error|Error:|ERROR|error\[|Failed|FAILED|Exception|not found|denied|refused)/.test(line));
                const picked = annotated.length
                  ? annotated.slice(-6).concat(toolErrors.length ? ['', '…底层错误输出：', ...toolErrors.slice(-8)] : [])
                  : toolErrors.slice(-20);
                const full = lines.join('\n');
                const MAX = 55000; // issue 正文上限 65536，留出余量
                const clipped = full.length > MAX;
                logSection = [
                  '### 关键错误',
                  '',
                  '```text',
                  picked.length ? picked.join('\n') : '（日志里没有明显的错误行，见下方完整日志）',
                  '```',
                  '',
                  `<details><summary>完整失败日志${clipped ? '（过长，仅保留末尾）' : ''}</summary>`,
                  '',
                  '````text',
                  clipped ? full.slice(-MAX) : full,
                  '````',
                  '',
                  '</details>',
                  '',
                ].join('\n');
              } else {
                logSection = '### 关键错误\n\n（本次未取到日志，请查看运行页面）\n';
              }
            } catch (error) {
              logSection = `### 关键错误\n\n（取日志失败：${error.message}。请查看运行页面）\n`;
            }

            const body = [
              '## 主干构建失败',
              '',
              '| 项目 | 值 |',
              '| --- | --- |',
              `| 分支 | \`${branch}\` |`,
              `| 提交 | [\`${sha}\`](${commitUrl}) |`,
              `| 触发 | ${context.eventName} · @${context.actor} |`,
              `| 运行 | [#${context.runNumber}](${runUrl}) |`,
              '',
              '### 失败的步骤',
              '',
              failedList,
              '',
              logSection,
              '### 本地复现',
              '',
              '```bash',
              'npm ci',
              'npm run ci        # 类型检查 + ESLint + 工具清单 + 图标名校验',
              'npm run package   # 打包（本地会递增版本号，CI 中已跳过）',
              '```',
              '',
              '### 处理说明',
              '',
              `修复后重新推送到 \`${branch}\`，CI 通过时该 issue 会被**自动关闭**。`,
              '',
              '> 本 issue 由 CI 自动维护：**同一分支只保留这一个** —— 再次失败时更新上面的正文',
              '> 并追加一条时间线评论，不会新建第二个；恢复时自动关闭。',
              '',
              MARKER,
            ].join('\n');

            // 4) 认领既有 issue：优先按正文标记找，其次退回按 label 找。
            //    这就是「有多个失败 issue 怎么办」的答案 —— 不再新建第二个。
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            const target = openIssues.find((issue) => (issue.body || '').includes(MARKER)) || openIssues[0];

            if (target) {
              // 正文更新为**本次**失败的详情。否则永远显示第一次的详情，越看越对不上。
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: target.number,
                body,
              });
              // 时间线：保留「第几次失败」的历史（正文只反映最新一次）
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: target.number,
                body: [
                  '### 再次失败',
                  '',
                  `- 运行：[#${context.runNumber}](${runUrl})`,
                  `- 提交：[\`${sha}\`](${commitUrl})`,
                  '- 正文已更新为本次失败的详情。',
                ].join('\n'),
              });
              core.info(`已更新 issue #${target.number}（正文 + 时间线评论）`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: `[CI] ${branch} 分支构建失败`,
                body,
                labels: [LABEL],
              });
              core.info(`已创建 issue #${created.data.number}`);
            }

  close-failure-issue:
    name: 构建恢复 → 关闭 Issue
    # 与 report-failure 保持一致，否则「市场发布失败但 release 被跳过」时
    # 这条路不会是 success()，也就不会去关闭遗留的失败 issue。
    needs: [verify, python-test, package, resolve, publish-ovsx, publish-vsce, publish-npm, publish-pypi, release]
    # 形成闭环：修好之后不用人工去关那个失败 issue
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 关闭遗留的失败 Issue
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'ci-failure';
            const MARKER = '<!-- ci-failure-report -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = (context.sha || '').slice(0, 7);
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });

            // 只认领本流程自己建的（正文带标记）—— 避免误关别人手工打了同一个 label 的 issue
            const mine = open.filter((issue) => (issue.body || '').includes(MARKER));
            const targets = mine.length ? mine : open;

            // 「修的是哪一次失败」怎么确定：正文里记录的提交就是**最近一次失败**的提交，
            // 下面这条评论补上**修复它的**提交 —— 两者落在同一条时间线上，对应关系是显式的。
            // 若历史上遗留了多个失败 issue（旧逻辑会重复创建），这里会逐个关闭并各自说明。
            for (const issue of targets) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  '✅ CI 已恢复，自动关闭该 issue。',
                  '',
                  `- 恢复运行：[#${context.runNumber}](${runUrl})`,
                  `- 修复提交：[\`${sha}\`](${commitUrl})`,
                  '',
                  '（本 issue 正文里记录的是最近一次失败的信息，可与上面的修复提交对照。）',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`已关闭 #${issue.number}`);
            }

            if (targets.length === 0) {
              core.info('没有遗留的失败 issue');
            }
