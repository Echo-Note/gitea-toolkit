name: Release

# 打 tag（形如 v0.1.3）时构建并发布 Release，附件为 .vsix。
#
# 版本号流程（与 scripts/bump-version.mjs 配合）：
#   1. 本地 npm run version:minor  → package.json 版本变为 0.2.0（并插入 CHANGELOG 区块）
#   2. 填写 CHANGELOG 后提交推送
#   3. git tag v0.2.0 && git push origin v0.2.0
#   4. 本 workflow 校验 tag 与 package.json 版本一致后打包发布
on:
  push:
    tags:
      - 'v*'

# 发布需要写 Release；不需要写其它内容
permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        # 这是防"发错版本"最有效的一道闸：
        # 版本号由 bump-version.mjs 写入 package.json，tag 由人工打，两者极易脱节。
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag = ${GITHUB_REF_NAME}（解析为 ${TAG_VERSION}），package.json = ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的版本 ${PKG_VERSION} 不一致。请先执行 npm run version:minor（或 major）并提交，再重新打 tag。"
            exit 1
          fi
          echo "版本一致：${PKG_VERSION}"

      - name: 发布前复跑校验
        # tag 指向的提交理应已通过 CI，但发版是关键动作，重复校验成本很低
        run: npm run ci

      - name: 打包 VSIX
        # 版本号已由 tag 前的提交确定，这里绝不能再递增
        run: SKIP_VERSION_BUMP=1 npm run package

      - name: 校验产物文件名与版本一致
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="gitea-toolkit-${PKG_VERSION}.vsix"
          if [ ! -f "${EXPECTED}" ]; then
            echo "::error::未找到预期产物 ${EXPECTED}，实际产物："
            ls -l ./*.vsix || true
            exit 1
          fi
          ls -lh "${EXPECTED}"

      - name: 创建 GitHub Release 并上传 VSIX
        # 直接用 runner 预装的 gh，避免引入第三方 action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.vsix \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: 写入摘要
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "## 已发布 ${GITHUB_REF_NAME}"
            echo
            echo "| 项目 | 值 |"
            echo '| --- | --- |'
            echo "| 版本 | \`${PKG_VERSION}\` |"
            echo "| 产物 | \`gitea-toolkit-${PKG_VERSION}.vsix\` |"
            echo "| Release | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME} |"
            echo
            echo "安装：下载 .vsix 后在 VS Code / CodeBuddy 中执行「Extensions: Install from VSIX...」。"
          } >> "$GITHUB_STEP_SUMMARY"
